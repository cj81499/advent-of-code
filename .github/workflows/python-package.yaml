name: Python Package

permissions:
  contents: none # default to no read access to repo contents

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  build:
    name: Build and test/lint on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    permissions:
      contents: read # grant read access to repo contents for this job
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sanity check Python version
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        # https://docs.python.org/3/using/cmdline.html#cmdoption-version
        run: |
          uv run --frozen python --version --version
          [[ "$(uv run --frozen python --version)" == Python\ $MATRIX_PYTHON_VERSION* ]]

      - name: Check python format (ruff)
        run: uv run --frozen ruff format --check .

      - name: Check toml format (ruff)
        run: uv run --frozen tombi format --check

      - name: Lint python (ruff)
        run: uv run --frozen ruff check --output-format=github .

      - name: Lint toml (tombi)
        run: uv run --frozen tombi lint

      - name: Check types (mypy)
        run: uv run --frozen mypy .

      - name: Run tests
        run: uv run --frozen pytest --cov=. --cov-report=xml

      # consider ditching codecov - https://hynek.me/articles/ditch-codecov-python/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  zizmor:
    name: Run zizmor static analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # allow zizmor to create code scanning alerts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run zizmor 🌈
        run: uvx zizmor --persona=auditor --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: zizmor

  check:
    name: Check if all jobs succeeded
    if: always()
    runs-on: Ubuntu-latest
    needs:
      - build
      - zizmor
    env:
      JOBS: ${{ toJSON(needs) }}
    steps:
      - name: Print job results
        run: echo "$JOBS"

      - name: Check if all jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: "${{ toJSON(needs) }}"
